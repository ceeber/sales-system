name: CI - Sales System

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  auth-service:
    name: Auth Service - Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./auth-service
        run: mvn clean verify


  api-gateway:
    name: API Gateway - Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./api-gateway
        run: mvn clean verify


  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - auth-service
      - api-gateway

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Auth Service
        working-directory: ./auth-service
        run: |
          docker build -t auth-service:ci .

      - name: Build API Gateway
        working-directory: ./api-gateway
        run: |
          docker build -t api-gateway:ci .