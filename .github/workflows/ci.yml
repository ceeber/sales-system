name: CI - Sales System

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  auth-service:
    name: Auth Service - Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./auth-service
        run: mvn clean verify

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar


  api-gateway:
    name: API Gateway - Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        working-directory: ./api-gateway
        run: mvn clean verify

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/*.jar


  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - auth-service
      - api-gateway

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Auth Service JAR
        uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target

      - name: Download API Gateway JAR
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Auth Service
        working-directory: ./auth-service
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest \
            .

      - name: Push Auth Service
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Build API Gateway
        working-directory: ./api-gateway
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest \
            .

      - name: Push API Gateway
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest